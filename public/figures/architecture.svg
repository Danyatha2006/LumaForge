<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title id="t">LumaForge system architecture</title>
  <desc id="d">Bayer RAW enters scene analysis, then classical ISP stages. The render, packed RAW and a noise map enter LumaNet, chosen by the adaptive router. Output is sRGB. Deployment uses Vercel and MongoDB Atlas.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52514e"/></marker>
    <style>
      .b{fill:#fff;stroke:#c9c7c0;stroke-width:1.4}
      .c{fill:#eaf2fc;stroke:#2a78d6;stroke-width:1.4}
      .n{fill:#e3f6ee;stroke:#1baf7a;stroke-width:1.4}
      .r{fill:#fdeee7;stroke:#eb6834;stroke-width:1.4}
      .t{font-size:15px;font-weight:600;fill:#0b0b0b;text-anchor:middle}
      .s{font-size:12.5px;fill:#52514e;text-anchor:middle}
      .h{font-size:13px;font-weight:700;fill:#52514e;letter-spacing:.05em}
      .l{stroke:#52514e;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .e{font-size:12px;fill:#52514e}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#fcfcfb"/>

  <text x="30" y="32" class="h">SENSOR INPUT</text>
  <rect x="30" y="46" width="170" height="76" rx="8" class="b"/>
  <text x="115" y="78" class="t">Bayer RAW</text>
  <text x="115" y="99" class="s">any 2x2 CFA, normalised to RGGB</text>
  <rect x="30" y="140" width="170" height="60" rx="8" class="b"/>
  <text x="115" y="166" class="t">Capture metadata</text>
  <text x="115" y="185" class="s">known digital gain, camera</text>

  <text x="240" y="32" class="h">SCENE ANALYSIS</text>
  <rect x="240" y="46" width="190" height="154" rx="8" class="r"/>
  <text x="335" y="76" class="t">Blind measurement</text>
  <text x="335" y="102" class="s">Shot and read noise fit</text>
  <text x="335" y="122" class="s">Brightness and clipping</text>
  <text x="335" y="142" class="s">Post-gain noise level</text>
  <text x="335" y="176" class="s">Sets every stage's strength</text>
  <path class="l" d="M200 84H240"/>
  <path class="l" d="M200 170H240"/>

  <text x="30" y="246" class="h">CLASSICAL BRANCH (NUMPY, NO LEARNED PARAMETERS)</text>
  <g>
    <rect x="30" y="260" width="150" height="84" rx="8" class="c"/><text x="105" y="292" class="t">Raw denoise</text><text x="105" y="312" class="s">stabilised guided</text><text x="105" y="328" class="s">filter</text>
    <rect x="212" y="260" width="150" height="84" rx="8" class="c"/><text x="287" y="292" class="t">White balance</text><text x="287" y="312" class="s">shades of grey +</text><text x="287" y="328" class="s">camera prior</text>
    <rect x="394" y="260" width="150" height="84" rx="8" class="c"/><text x="469" y="292" class="t">Demosaic</text><text x="469" y="312" class="s">Malvar-He-Cutler</text>
    <rect x="576" y="260" width="150" height="84" rx="8" class="c"/><text x="651" y="292" class="t">CCM and tone</text><text x="651" y="312" class="s">fitted matrix, tone</text><text x="651" y="328" class="s">curve, sRGB gamma</text>
    <rect x="758" y="260" width="150" height="84" rx="8" class="c"/><text x="833" y="292" class="t">Chroma filter</text><text x="833" y="312" class="s">YCbCr, guided by luma</text>
    <rect x="1000" y="260" width="170" height="84" rx="8" class="c"/><text x="1085" y="292" class="t">Traditional output</text><text x="1085" y="312" class="s">luma unsharp mask</text><text x="1085" y="328" class="s">baseline arm</text>
  </g>
  <path class="l" d="M180 302H212"/><path class="l" d="M362 302H394"/><path class="l" d="M544 302H576"/><path class="l" d="M726 302H758"/><path class="l" d="M908 302H1000"/>
  <path class="l" d="M335 200V232H105V260"/>

  <text x="30" y="396" class="h">LEARNED BRANCH (ONNX RUNTIME)</text>
  <rect x="30" y="410" width="190" height="104" rx="8" class="b"/>
  <text x="125" y="440" class="t">Network inputs</text>
  <text x="125" y="464" class="s">Packed RAW, gain-corrected</text>
  <text x="125" y="482" class="s">Noise map</text>
  <text x="125" y="500" class="s">Classical render</text>

  <rect x="270" y="410" width="180" height="104" rx="8" class="r"/>
  <text x="360" y="440" class="t">Adaptive router</text>
  <text x="360" y="464" class="s">Post-gain noise</text>
  <text x="360" y="482" class="s">against the gate</text>

  <rect x="500" y="404" width="240" height="54" rx="8" class="n"/>
  <text x="620" y="426" class="t">Compact hybrid</text>
  <text x="620" y="446" class="s">width 12, int8, low noise</text>
  <rect x="500" y="468" width="240" height="54" rx="8" class="n"/>
  <text x="620" y="490" class="t">Learned</text>
  <text x="620" y="510" class="s">width 24, int8, high noise</text>

  <rect x="790" y="410" width="170" height="104" rx="8" class="n"/>
  <text x="875" y="440" class="t">Refinement</text>
  <text x="875" y="464" class="s">global colour matrix</text>
  <text x="875" y="482" class="s">+ local residual</text>
  <text x="875" y="500" class="s">on the render</text>

  <rect x="1000" y="410" width="170" height="104" rx="8" class="b" style="stroke:#0b0b0b;stroke-width:2"/>
  <text x="1085" y="452" class="t">Hybrid sRGB</text>
  <text x="1085" y="474" class="s">deployed output</text>

  <path class="l" d="M833 344V378H125V410"/>
  <text x="470" y="370" class="e">unsharpened render is the base layer</text>
  <path class="l" d="M220 462H270"/>
  <path class="l" d="M450 448L500 431"/><path class="l" d="M450 476L500 495"/>
  <path class="l" d="M740 431L790 448"/><path class="l" d="M740 495L790 476"/>
  <path class="l" d="M960 462H1000"/>

  <text x="30" y="568" class="h">DEPLOYMENT</text>
  <rect x="30" y="582" width="250" height="84" rx="8" class="b"/>
  <text x="155" y="612" class="t">Next.js on Vercel</text>
  <text x="155" y="634" class="s">lab, results, architecture pages</text>
  <rect x="380" y="582" width="310" height="84" rx="8" class="b"/>
  <text x="535" y="612" class="t">FastAPI Python function on Vercel</text>
  <text x="535" y="634" class="s">NumPy ISP + ONNX Runtime, no PyTorch</text>
  <rect x="790" y="582" width="380" height="84" rx="8" class="b"/>
  <text x="980" y="612" class="t">MongoDB Atlas</text>
  <text x="980" y="634" class="s">run telemetry and evaluation results, never images</text>
  <path class="l" d="M280 624H380"/><text x="294" y="614" class="e">/api/process</text>
  <path class="l" d="M690 624H790"/><text x="707" y="614" class="e">optional</text>
</svg>
